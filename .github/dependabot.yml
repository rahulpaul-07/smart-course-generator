version: 2

# Routine patch/minor bumps arrive as one grouped PR per ecosystem each week.
# Major versions (Express 5, TypeScript 7, Tailwind 4, ESLint 10, ...) are
# migrations, not bumps: they are ignored here and done deliberately by hand,
# so the PR list only ever holds changes that are safe to merge on green CI.
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-minor:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # mongoose 9.10 ships MongoDB driver 7.6, whose connection handshake is
      # rejected ("Missing required sub-document 'driver' in the client
      # metadata document"). Held at 9.7.x until verified against Atlas.
      - dependency-name: "mongoose"
        versions: [">=9.8.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

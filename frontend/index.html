<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseAI — Turn any topic into a structured course</title>
    <meta name="description" content="CourseAI generates complete, structured courses from a single prompt — streamed lesson by lesson, with quizzes, flashcards, mock interviews and verifiable certificates." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CourseAI — Turn any topic into a structured course" />
    <meta property="og:description" content="Structured AI courses streamed lesson by lesson, backed by a multi-provider router with failover, evals and RAG grounding." />
    <meta property="og:image" content="https://smart-course-generator.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <script>
      // First-paint theme, before React mounts (see src/lib/theme.ts).
      (function () {
        try {
          var pref = localStorage.getItem('theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>CourseAI needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
